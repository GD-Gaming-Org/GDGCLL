<!DOCTYPE html>
<html>
  <head>
    <title>Log in — GDGCLL</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="../data/data.js?v=4" defer></script>
    <script src="../js/buttons.js?v=4" defer></script>
    <link rel="stylesheet" href="../css/style.css?v=4">
  </head>
  <body>

    <div class="header">
      <img class="logo" id="logoImg" alt="GDGCLL">
      <h2 class="logo-text" id="logoText" hidden>GDGCLL</h2>
      <button class="profile" id="back">Back</button>
    </div>

    <div class="content">
      <div class="form-box">
        <h2 class="form-title">Log in</h2>

        <label class="field">
          <span>Username</span>
          <input type="text" id="userInput" autocomplete="username">
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="passInput" autocomplete="current-password">
        </label>

        <button class="login" id="loginGo">Log in</button>

        <div class="or-line"><span>Enter via code</span></div>

        <label class="field">
          <span>Account code</span>
          <input type="text" id="codeInput" placeholder="GDG-XXXX-XXXX" autocomplete="off">
        </label>

        <button class="profile wide" id="codeGo">Enter</button>

        <p class="form-note" id="loginMsg"></p>
        <p class="form-link">No account? <a href="register.html">Register here</a></p>
      </div>
    </div>

    <footer>
      <div class="foot-cols">

        <div class="foot-col">
          <h4>GDGCLL</h4>
          <a href="../index.html">Back to the list</a>
        </div>

        <div class="foot-col">
          <h4>Account</h4>
          <a href="login.html">Log in</a>
          <a href="register.html">Register</a>
        </div>

        <div class="foot-col">
          <h4>Community</h4>
          <a href="https://discord.gg/7B5erApgk" target="_blank" rel="noopener">Discord</a>
        </div>

      </div>

      <div class="foot-bar">
        <p>
          Logo by <a href="https://www.youtube.com/@WALTUH3636">valtuh3636</a>
          &middot; Made by
          <a href="https://github.com/pester33">pester33</a> and
          <a href="https://www.youtube.com/@TuffTheo">TuffTheo</a>
        </p>
      </div>
    </footer>

  </body>
</html>
