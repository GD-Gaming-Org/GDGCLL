<!DOCTYPE html>
<html>
  <head>
    <title>Register — GDGCLL</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="../data/data.js" defer></script>
    <script src="../js/buttons.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>

    <div class="header">
      <img class="logo" id="logoImg" alt="GDGCLL">
      <h2 class="logo-text" id="logoText" hidden>GDGCLL</h2>
      <button class="profile" id="back">Back</button>
    </div>

    <div class="content">
      <div class="form-box">
        <h2 class="form-title">Register</h2>

        <label class="field">
          <span>Username</span>
          <input type="text" id="regUser" autocomplete="username">
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="regPass" autocomplete="new-password">
        </label>

        <label class="field">
          <span>Confirm password</span>
          <input type="password" id="regPass2" autocomplete="new-password">
        </label>

        <button class="login" id="regGo">Register</button>

        <p class="form-note" id="regMsg"></p>
        <p class="form-link">Already have one? <a href="login.html">Log in here</a></p>
      </div>
    </div>

    <footer>
      <div class="foot-cols">

        <div class="foot-col">
          <h4>GDGCLL</h4>
          <a href="../index.html">Back to the list</a>
        </div>

        <div class="foot-col">
          <h4>Account</h4>
          <a href="login.html">Log in</a>
          <a href="register.html">Register</a>
        </div>

        <div class="foot-col">
          <h4>Community</h4>
          <a href="https://discord.gg/7B5erApgk" target="_blank" rel="noopener">Discord</a>
        </div>

      </div>

      <div class="foot-bar">
        <p>
          Logo by <a href="https://www.youtube.com/@WALTUH3636">valtuh3636</a>
          &middot; Made by
          <a href="https://github.com/pester33">pester33</a> and
          <a href="https://www.youtube.com/@TuffTheo">TuffTheo</a>
        </p>
      </div>
    </footer>

  </body>
</html>
