<!DOCTYPE html>
<html>
  <head>
    <title>GDGCLL</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="data/data.js" defer></script>
    <script src="js/buttons.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <div class="header">
      <img class="logo" id="logoImg" src="logo/image.png" alt="GDGCLL">
      <h2 class="logo-text" id="logoText" hidden>GDGCLL</h2>
      <button class="login" id="login">Log in</button>
      <button class="login" id="register">Register</button>
      <button class="profile" id="profile">Profile</button>
    </div>

    <div class="tabs">
      <button class="tab" id="tabList">Top Hardest Levels</button>
      <button class="tab" id="tabScores">Top Leaderboard Players</button>
      <button class="tab" id="tabStaff">Staff</button>
      <button class="tab" id="tabAdmin" hidden>Admin</button>
    </div>

    <div class="content">
      <div id="msg"></div>
      <div id="levels"></div>
      <div id="scores" hidden></div>
      <div id="staff" hidden></div>
      <div id="admin" hidden></div>
      <div class="detail" id="detail" hidden></div>
    </div>

    <footer>
      <div class="foot-cols">

        <div class="foot-col">
          <h4>GDGCLL</h4>
          <a href="#" data-goto="list">Top Hardest Levels</a>
          <a href="#" data-goto="scores">Top Leaderboard Players</a>
          <a href="#" data-goto="staff">Staff</a>
        </div>

        <div class="foot-col">
          <h4>Account</h4>
          <a href="html/login.html">Log in</a>
          <a href="html/register.html">Register</a>
        </div>

        <div class="foot-col">
          <h4>Community</h4>
          <a href="https://discord.gg/7B5erApgk" target="_blank" rel="noopener">Discord</a>
        </div>

      </div>

      <div class="foot-bar">
        <p>
          Logo by <a href="https://www.youtube.com/@WALTUH3636">valtuh3636</a>
          &middot; Made by
          <a href="https://github.com/pester33">pester33</a> and
          <a href="https://www.youtube.com/@TuffTheo">TuffTheo</a>
        </p>
      </div>
    </footer>

  </body>
</html>
