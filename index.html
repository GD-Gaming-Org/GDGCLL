<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDGCLL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=12">
<script src="data/data.js?v=12" defer></script>
<script src="js/buttons.js?v=12" defer></script>
</head>
<body>

<header class="top">
  <div class="brand" data-go="home">GDG<span>CLL</span></div>
  <nav class="nav">
    <button data-go="list">Ranking</button>
    <button data-go="board">Records</button>
    <button data-go="staff">Staff</button>
    <button data-go="submit" id="navSubmit">Submit</button>
    <button data-go="updates" id="navUpdates" style="position:relative;">
      Updates
      <span id="updateBadge" style="display:none;position:absolute;top:-5px;right:-5px;background:#ff4d4d;color:#fff;border-radius:50%;padding:2px 5px;font-size:10px;font-weight:bold;">New</span>
    </button>
    <button data-go="admin" id="navAdmin" hidden>Admin</button>
  </nav>
  <div class="top-right" style="display:flex; gap:6px; align-items:center;">
    <button class="btn" id="navRefresh" style="padding: 0 10px; font-size: 16px;" title="Hard Refresh">🔄</button>
    <button class="btn" id="navLogin">Log in</button>
    <div id="userWrap" style="display:inline-flex;gap:6px;" hidden>
      <button class="btn" id="navBell" style="position:relative; padding: 0 10px; font-size: 16px;">
        🔔
        <span id="bellBadge" style="display:none;position:absolute;top:-5px;right:-5px;background:#ff4d4d;color:#fff;border-radius:50%;padding:2px 5px;font-size:10px;font-weight:bold;">0</span>
      </button>
      <button class="btn btn-primary" id="navProfile">Profile</button>
    </div>
  </div>
</header>

<main class="shell">

  <section class="page" id="p-home">
    <div class="hero">
      <h1>GDG<span>CLL</span></h1>
      <h2>Gaming Demon List</h2>
    </div>

    <div class="tiles">
      <button class="tile" data-go="list">
        <div class="tile-name">Ranking</div>
        <div class="tile-art" data-ico="ranking"></div>
      </button>
      <button class="tile" data-go="board">
        <div class="tile-name">Records</div>
        <div class="tile-art" data-ico="trophy"></div>
      </button>
      <button class="tile" data-go="staff">
        <div class="tile-name">Staff</div>
        <div class="tile-art" data-ico="staff"></div>
      </button>
      <button class="tile locked" disabled>
        <div class="tile-name">Informative</div>
        <div class="tile-art" data-ico="info"></div>
        <span class="tile-soon">COMING SOON</span>
      </button>
    </div>

    <div class="cta-wrap">
      <button class="cta" data-go="list">Check it out <i>&rarr;</i></button>
    </div>
  </section>

  <section class="page" id="p-list" hidden>
    <div class="head">
      <h1>Ranking</h1>
    </div>
    <div class="split">
      <div class="cards" id="rows"></div>
      <aside class="detail" id="detail"></aside>
    </div>
  </section>

  <section class="page" id="p-board" hidden>
    <div class="head">
      <h1>Records</h1>
    </div>
    <div class="lb" id="lb"></div>
  </section>

  <section class="page" id="p-staff" hidden>
    <div class="head">
      <h1>Staff</h1>
    </div>
    <div class="grid" id="staff"></div>
  </section>

  <section class="page" id="p-login" hidden>
    <div class="box">
      <h2>Log in</h2>

      <label class="field"><span>USERNAME</span>
        <input type="text" id="userInput" placeholder="Your GD username"></label>

      <label class="field"><span>PASSWORD</span>
        <input type="password" id="passInput" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></label>

      <button class="go" id="loginGo">Log in</button>

      <div class="or">STAFF ACCESS</div>

      <label class="field"><span>ACCOUNT CODE</span>
        <input type="text" id="codeInput" placeholder="GDG-XXXX-XXXX"></label>

      <button class="go go-alt" id="codeGo">Enter with code</button>

      <p class="note" id="loginMsg"></p>
      <p class="alt">No account? <a data-go="register">Register here</a></p>
    </div>
  </section>

  <section class="page" id="p-register" hidden>
    <div class="box">
      <h2>Register</h2>

      <label class="field"><span>USERNAME</span>
        <input type="text" id="regUser" placeholder="Your GD username"></label>

      <label class="field"><span>PASSWORD</span>
        <input type="password" id="regPass" placeholder="At least 6 characters"></label>

      <label class="field"><span>CONFIRM PASSWORD</span>
        <input type="password" id="regPass2" placeholder="Type it again"></label>

      <button class="go" id="regGo">Register</button>

      <p class="note" id="regMsg"></p>
      <p class="alt">Already have one? <a data-go="login">Log in here</a></p>
    </div>
  </section>

  <section class="page" id="p-profile" hidden></section>
  <section class="page" id="p-inbox" hidden></section>
  <section class="page" id="p-admin" hidden></section>
  <section class="page" id="p-submit" hidden></section>
  <section class="page" id="p-updates" hidden></section>

</main>

<div style="max-width:820px;margin:0 auto;padding:0 18px 24px;text-align:center">
  <a href="https://gd-gaming-ch.gamer.free/demonlist/" target="_blank" rel="noopener"
     style="display:inline-block;font-weight:900;font-size:13px;padding:11px 20px;
            border:1px dashed var(--dash);color:var(--accent);text-decoration:none">
    Check out GGCL! &rarr;
  </a>
</div>

<footer>
  Logo by <a href="https://www.youtube.com/@WALTUH3636">valtuh3636</a> &middot;
  Made by <a href="https://github.com/pester33">pester33</a> and
  <a href="https://www.youtube.com/@TuffTheo">TuffTheo</a>
</footer>
</body>
</html>
