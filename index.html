<!DOCTYPE html>
<html>
  <head>
    <title>GDGCLL</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script src="js/buttons.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <div class="header">
      <img class="logo" src="logo./image.png" alt="GDGCLL">
      <button class="login" id="login">Log in</button>
      <button class="login" id="register">Register</button>
      <button class="profile" id="profile">Profile</button>
    </div>

    <div class="tabs">
      <button class="tab" id="tabList">Top Hardest Levels</button>
      <button class="tab" id="tabScores">Top Leaderboard Players</button>
    </div>

    <div class="content">
      <div id="msg"></div>
      <div id="levels"></div>
      <div id="scores" hidden></div>
      <div class="detail" id="detail" hidden></div>
    </div>

    <footer>
      Logo by <a href="https://www.youtube.com/@WALTUH3636">valtuh3636</a>
    </footer>

  </body>
</html>
